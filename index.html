<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习笔记 | Rong-yyc</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            color: #2d3748;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            line-height: 1.6;
        }
        .container {
            background: white;
            padding: 3rem 4rem;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            max-width: 640px;
            text-align: center;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            color: #1a202c;
        }
        .emoji {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        .bio {
            font-size: 1.1rem;
            color: #4a5568;
            margin-bottom: 1.5rem;
        }
        .links {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .links a {
            color: #4a5568;
            text-decoration: none;
            padding: 0.5rem 1.2rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 30px;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }
        .links a:hover {
            background: #2d3748;
            color: white;
            border-color: #2d3748;
        }
        .footer {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #a0aec0;
        }
        .footer a {
            color: #a0aec0;
            text-decoration: none;
        }
        .footer a:hover {
            color: #2d3748;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">📚</div>
        <h1>学习笔记</h1>
        <p class="bio">
            这里的读书笔记记载了笔者在学习相关领域知识时的一些感悟和心得，<br>
            也算为将来的复习减少负担。
        </p>
        <div class="links">
            <a href="https://github.com/Rong-yyc" target="_blank">GitHub</a>
            <a href="/blog">博客文章 →</a>
        </div>
        <div class="footer">
            © 2026 Rong-yyc · 用 ❤️ 和 ☕ 驱动
        </div>
    </div>
</body>
</html>
