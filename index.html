<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>尧辰 | 个人主页</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Georgia, "Noto Serif CJK SC", serif;
            background: #edf3f0;
            color: #17232d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            line-height: 1.6;
            padding: 2rem 1.25rem;
            position: relative;
        }
        .container {
            background: #fffdf8;
            border: 1px solid #d8e4df;
            border-radius: 8px;
            box-shadow: 12px 12px 0 #cfe0d9;
            max-width: 760px;
            padding: clamp(2rem, 7vw, 4.5rem);
            position: relative;
            text-align: center;
        }
        h1 {
            font-size: clamp(2.5rem, 8vw, 4.8rem);
            letter-spacing: 0;
            margin-bottom: 0.25rem;
            color: #17232d;
        }
        .subtitle {
            font-size: 1rem;
            color: #6d7c86;
            margin-bottom: 1.5rem;
        }
        .avatar {
            width: 112px;
            height: 112px;
            object-fit: cover;
            border-radius: 14px;
            border: 1px solid #d8e4df;
            box-shadow: 8px 8px 0 #cfe0d9;
            margin: 0.25rem 0 1rem;
        }
        .section {
            text-align: left;
            margin: 2.5rem 0;
        }
        .section h2 {
            font-size: 1rem;
            color: #0f766e;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid #dce6e9;
            padding-bottom: 0.3rem;
        }
        .section ul {
            list-style: none;
            padding: 0;
        }
        .section ul li {
            padding: 0.2rem 0;
            color: #40545d;
            font-size: 0.98rem;
        }
        .section ul li .highlight {
            color: #17232d;
            font-weight: 500;
        }
        .section ul li .muted {
            color: #7f8d93;
            font-size: 0.9rem;
        }
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            margin-top: 0.3rem;
        }
        .tags span {
            background: #dceee8;
            color: #155e59;
            padding: 0.45rem .85rem;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        .links {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 2rem;
        }
        .links a {
            color: #0f766e;
            text-decoration: none;
            padding: 0.5rem 1.2rem;
            border: 1px solid #b9d0c8;
            border-radius: 4px;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }
        .links a:hover {
            background: #17232d;
            color: white;
            border-color: #17232d;
        }
        .footer {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #7f8d93;
        }
        .footer a {
            color: #0f766e;
            text-decoration: none;
        }
        .footer a:hover {
            color: #17232d;
        }
        @media (max-width: 560px) { body { align-items: flex-start; padding-top: 1rem; } .container { box-shadow: 6px 6px 0 #cfe0d9; } }
    </style>
</head>
<body>
    <div class="container">
        <img class="avatar" src="avatar.jpg" alt="尧辰的头像">
        <h1>尧辰</h1>
        <p class="subtitle">男 · 系统与软件安全方向</p>

        <div class="section">
            <h2>📖 教育经历</h2>
            <ul>
                <li><span class="highlight">2017 – 2021</span> 华东师范大学 · 本科 <span class="muted">| 软件工程学院</span></li>
                <li><span class="highlight">2021 – 2023</span> 东部战区机关 · <span class="muted">陆军</span></li>
                <li><span class="highlight">2024 – 2027</span> 复旦大学 · 硕士 <span class="muted">| 系统与软件安全</span></li>
            </ul>
        </div>

        <div class="section">
            <h2>🔬 主要研究方向</h2>
            <div class="tags">
                <span>Agent 应用开发</span>
                <span>安全智能体开发</span>
            </div>
        </div>

        <div class="links">
            <a href="https://github.com/rong4xxz" target="_blank">GitHub</a>
            <a href="/blog">📝 博客文章 →</a>
        </div>

        <div class="footer">
            © 2026 尧辰 · 勇敢的人先享受世界
        </div>
    </div>
</body>
</html>
