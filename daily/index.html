*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Georgia,"Noto Serif CJK SC",serif;background:#edf3f0;color:#17232d;
 display:flex;justify-content:center;align-items:flex-start;min-height:100vh;
 line-height:1.7;padding:2.5rem 1.25rem}
.container{background:#fffdf8;border:1px solid #d8e4df;border-radius:8px;
 box-shadow:12px 12px 0 #cfe0d9;max-width:820px;width:100%;
 padding:clamp(1.8rem,5vw,3.4rem);position:relative}
a{color:#0f766e;text-decoration:none}
a:hover{color:#17232d}
.topnav{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;
 margin-bottom:2.2rem;padding-bottom:1.2rem;border-bottom:1px solid #dce6e9}
.topnav a{padding:.4rem 1rem;border:1px solid #b9d0c8;border-radius:4px;
 font-size:.92rem;transition:all .2s ease}
.topnav a:hover{background:#17232d;color:#fff;border-color:#17232d}
.topnav a.on{background:#dceee8;color:#155e59;border-color:#b9d0c8;font-weight:600}
header{text-align:center;margin-bottom:2rem}
h1{font-size:clamp(1.8rem,5vw,2.6rem);letter-spacing:0;margin-bottom:.3rem}
.sub{color:#6d7c86;font-size:.92rem}
h2.sec{font-size:.95rem;color:#0f766e;text-transform:uppercase;letter-spacing:.05em;
 margin:2.4rem 0 1rem;padding-bottom:.3rem;border-bottom:1px solid #dce6e9}
.item{background:#fff;border:1px solid #e3ece8;border-radius:6px;
 padding:1.1rem 1.3rem;margin:.9rem 0;transition:border-color .15s}
.item:hover{border-color:#b9d0c8}
.item.hot{background:#fbfdf9;border-color:#c9dfd4;border-left:3px solid #0f766e}
.item h3{margin:0 0 .5rem;font-size:1.06rem;line-height:1.55;font-weight:600}
.item h3 .num{color:#8aa0a0;font-weight:400;margin-right:.4rem}
.meta{color:#7f8d93;font-size:.82rem;margin-bottom:.6rem;display:flex;
 align-items:center;gap:.5rem;flex-wrap:wrap}
.src{display:inline-block;font-size:.75rem;padding:.1rem .55rem;border-radius:4px;
 background:#dceee8;color:#155e59}
.hotbadge{display:inline-block;font-size:.75rem;padding:.1rem .55rem;border-radius:4px;
 background:#f7ead0;color:#8a6116;font-weight:600}
.sum{color:#40545d;font-size:.94rem;line-height:1.85;margin:0 0 .7rem}
.read{font-size:.87rem}
.comment{background:#f7fbf9;border:1px solid #dce6e9;border-left:3px solid #0f766e;
 border-radius:6px;padding:1.3rem 1.5rem;margin:1rem 0}
.comment h3{margin:0 0 .8rem;font-size:1rem;font-weight:600}
.comment p{margin:0 0 .7rem;color:#40545d;font-size:.94rem;line-height:1.85}
.comment strong{color:#17232d}
.comment code{background:#edf3f0;padding:.05rem .35rem;border-radius:3px;font-size:.88rem}
nav.arch{margin-top:2.6rem;border-top:1px solid #dce6e9;padding-top:1.4rem}
nav.arch h2{font-size:.85rem;color:#7f8d93;font-weight:500;margin:0 0 .9rem}
nav.arch ul{list-style:none;display:flex;flex-wrap:wrap;gap:.5rem}
nav.arch li a{display:block;padding:.35rem .8rem;border:1px solid #d8e4df;border-radius:4px;
 font-size:.85rem;background:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
 gap:.8rem;margin:1.2rem 0}
.stat{background:#fff;border:1px solid #e3ece8;border-radius:6px;padding:1rem 1.1rem}
.stat .k{color:#7f8d93;font-size:.8rem;margin-bottom:.3rem}
.stat .v{font-size:1.5rem;font-weight:600;color:#17232d}
.stat .u{font-size:.85rem;color:#7f8d93;font-weight:400;margin-left:.15rem}
.tl{position:relative;margin:1rem 0 0 .4rem;padding-left:1.3rem;
 border-left:1px solid #dce6e9}
.tl .row{position:relative;margin-bottom:1.1rem}
.tl .row::before{content:"";position:absolute;left:-1.63rem;top:.45rem;width:8px;height:8px;
 border-radius:50%;background:#0f766e;box-shadow:0 0 0 3px #fffdf8}
.tl .d{font-size:.85rem;color:#7f8d93;margin-bottom:.3rem}
.tl .c{background:#fff;border:1px solid #e3ece8;border-radius:6px;
 padding:.7rem .9rem;font-size:.92rem}
.tag{display:inline-block;font-size:.75rem;padding:.1rem .55rem;border-radius:4px;
 background:#dceee8;color:#155e59;margin-right:.4rem}
.tag.run{background:#e2f0e6;color:#2f6f4a}
.tag.gym{background:#f7ead0;color:#8a6116}
.todo{background:#fff;border:1px solid #e3ece8;border-radius:6px;
 padding:.9rem 1.1rem;margin:.7rem 0;display:flex;gap:.8rem;align-items:flex-start}
.todo .box{width:15px;height:15px;border:2px solid #b9d0c8;border-radius:4px;
 flex:none;margin-top:.35rem}
.todo .txt{flex:1;font-size:.95rem}
.todo .when{color:#7f8d93;font-size:.82rem;margin-top:.25rem}
.empty{color:#7f8d93;padding:3rem 0;text-align:center}
footer{margin-top:2.6rem;padding-top:1.2rem;border-top:1px solid #dce6e9;
 font-size:.82rem;color:#7f8d93;text-align:center}
@media(max-width:560px){body{padding:1rem .7rem}
 .container{box-shadow:6px 6px 0 #cfe0d9;padding:1.5rem 1.2rem}}
</style></head>
